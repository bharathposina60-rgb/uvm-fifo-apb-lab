name: sim

on:
  push:
  pull_request:

jobs:
  verilator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator g++ make
          verilator --version

      - name: Run self-checking Verilator sim
        run: make sim
